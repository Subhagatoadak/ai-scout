<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI Scout" />
  <title>AI Research Scout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      background: #0a0a0f;
      color: #e2e8f0;
      font-family: 'Syne', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0a0a0f; }
    ::-webkit-scrollbar-thumb { background: #2d2d44; border-radius: 2px; }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.2} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    @keyframes spin { to{transform:rotate(360deg)} }
    .topic-chip { transition: all 0.18s ease; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
    .topic-chip:active { transform: scale(0.96); }
    .result-card { animation: fadeUp 0.4s ease both; }
    .run-btn { transition: all 0.2s ease; -webkit-tap-highlight-color: transparent; }
    .run-btn:active:not(:disabled) { transform: scale(0.98); }
    input { -webkit-appearance: none; }
    input:focus { outline: none; border-color: #6366f1 !important; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useCallback } = React;

const TOPICS = [
  { id: "agentic_dev",   label: "Agentic Development", icon: "⟳", query: "agentic AI development frameworks LangGraph AutoGen CrewAI 2025 2026 latest" },
  { id: "ai_governance", label: "AI Governance",        icon: "⚖", query: "AI governance frameworks EU AI Act NIST RMF compliance tools 2025 2026" },
  { id: "python_pkgs",   label: "Python Packages",      icon: "⬡", query: "trending Python packages AI ML tools 2025 2026 GitHub new releases" },
  { id: "llm_infra",     label: "LLM Infrastructure",   icon: "◈", query: "LLM inference infrastructure vLLM SGLang distributed serving 2025 2026" },
  { id: "ai_design",     label: "AI Design Patterns",   icon: "✦", query: "AI system design patterns compound AI architecture best practices 2026" },
  { id: "rag",           label: "RAG & Retrieval",      icon: "◎", query: "RAG retrieval augmented generation advanced techniques vector search 2026" },
  { id: "devtools",      label: "Dev Tools",            icon: "⌥", query: "AI developer tools coding assistants LLMOps observability 2025 2026" },
  { id: "evals",         label: "Evals & Testing",      icon: "≋", query: "LLM evaluation benchmarks testing frameworks Braintrust LangSmith 2026" },
];

const CARD_COLORS = [
  { bg: "rgba(245,158,11,0.08)",  border: "rgba(245,158,11,0.3)",  accent: "#f59e0b" },
  { bg: "rgba(99,102,241,0.08)",  border: "rgba(99,102,241,0.3)",  accent: "#6366f1" },
  { bg: "rgba(16,185,129,0.08)",  border: "rgba(16,185,129,0.3)",  accent: "#10b981" },
  { bg: "rgba(239,68,68,0.08)",   border: "rgba(239,68,68,0.3)",   accent: "#ef4444" },
  { bg: "rgba(59,130,246,0.08)",  border: "rgba(59,130,246,0.3)",  accent: "#3b82f6" },
  { bg: "rgba(168,85,247,0.08)",  border: "rgba(168,85,247,0.3)",  accent: "#a855f7" },
];

const TAG_COLORS = ["#f59e0b","#6366f1","#10b981","#3b82f6","#a855f7","#ef4444","#14b8a6"];
const TYPE_COLORS = { REPO:"#10b981", PAPER:"#a855f7", PACKAGE:"#f59e0b", TOOL:"#3b82f6", ARTICLE:"#6366f1", INSIGHT:"#ef4444" };

function extractTags(text) {
  const kw = ["GitHub","Python","LLM","Agent","RAG","API","CLI","SDK","Framework","Open source","Governance","Policy","Inference","Evaluation","Benchmark","Tool","Library","Research","Paper"];
  return kw.filter(k => text.toLowerCase().includes(k.toLowerCase())).slice(0, 4);
}
function inferType(text) {
  if (/github\.com/i.test(text)) return "REPO";
  if (/arxiv|paper|research|study/i.test(text)) return "PAPER";
  if (/package|pip install|pypi/i.test(text)) return "PACKAGE";
  if (/tool|cli|framework|library/i.test(text)) return "TOOL";
  if (/guide|tutorial|blog|post/i.test(text)) return "ARTICLE";
  return "INSIGHT";
}

function parseResults(text) {
  try {
    const m = text.match(/```json\n?([\s\S]*?)\n?```/) || text.match(/(\{[\s\S]*"items"[\s\S]*\})/);
    if (m) { const p = JSON.parse(m[1]); if (p.items?.length) return p.items; }
  } catch {}
  // Try bare JSON
  try {
    const bare = text.trim();
    if (bare.startsWith("{")) { const p = JSON.parse(bare); if (p.items?.length) return p.items; }
  } catch {}
  // Markdown fallback
  const items = [];
  const sections = text.split(/\n(?=#{1,3}\s|\d+\.\s|\*\*[^*]+\*\*)/).filter(s => s.trim().length > 30);
  sections.forEach((section, i) => {
    const tm = section.match(/^#{1,3}\s+(.+)|^\d+\.\s+\*\*(.+?)\*\*|^\*\*(.+?)\*\*/m);
    const title = tm ? (tm[1]||tm[2]||tm[3]).replace(/\*\*/g,"") : `Finding ${i+1}`;
    const urlMatch = section.match(/https?:\/\/[^\s\)>\"]+/);
    const body = section.replace(/^#{1,3}\s+.+\n?/,"").replace(/\*\*/g,"").trim().slice(0,280);
    if (title && body.length > 20)
      items.push({ title: title.slice(0,90), body, url: urlMatch?.[0]||null, tags: extractTags(section), type: inferType(section) });
  });
  return items.slice(0, 14);
}

function buildPrompt(selected) {
  const topicObjs = TOPICS.filter(t => selected.includes(t.id));
  const queries = topicObjs.map(t => `- ${t.label}: ${t.query}`).join("\n");
  return `You are an expert AI research intelligence agent. Use web search to find the latest and most important developments across these topics in 2025-2026:\n\n${queries}\n\nFor each topic find: top GitHub repos, notable Python packages, key papers or blog posts, important frameworks/methodologies, governance standards if relevant.\n\nReturn ONLY a raw JSON object (no markdown, no preamble) in this exact format:\n{"items":[{"title":"...","body":"2-3 sentence summary of importance","url":"https://... or null","tags":["tag1","tag2"],"type":"REPO|PAPER|PACKAGE|TOOL|ARTICLE|INSIGHT","topic":"topic name"}]}\n\nFind 2-3 items per topic. Focus on genuinely new, impactful discoveries from 2025-2026.`;
}

function App() {
  const [selected, setSelected] = useState(["agentic_dev","ai_governance"]);
  const [results, setResults]   = useState([]);
  const [loading, setLoading]   = useState(false);
  const [status, setStatus]     = useState("");
  const [provider, setProvider] = useState("claude");
  const [claudeKey, setClaudeKey] = useState("");
  const [openaiKey, setOpenaiKey] = useState("");
  const [searched, setSearched] = useState(false);
  const [error, setError]       = useState("");
  const [showSetup, setShowSetup] = useState(true);

  const toggleTopic = id =>
    setSelected(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);

  const searchWithClaude = async () => {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type":"application/json", "x-api-key": claudeKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514", max_tokens: 4000,
        tools: [{ type:"web_search_20250305", name:"web_search" }],
        messages: [{ role:"user", content: buildPrompt(selected) }],
      }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
  };

  const searchWithOpenAI = async () => {
    const res = await fetch("https://api.openai.com/v1/responses", {
      method: "POST",
      headers: { "Content-Type":"application/json", "Authorization":`Bearer ${openaiKey}` },
      body: JSON.stringify({
        model: "gpt-4o", tools:[{ type:"web_search_preview" }],
        input: buildPrompt(selected), max_output_tokens: 4000,
      }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return (data.output||[]).filter(b=>b.type==="message")
      .flatMap(b=>b.content||[]).filter(c=>c.type==="output_text").map(c=>c.text).join("\n");
  };

  const runSearch = useCallback(async () => {
    if (selected.length === 0) { setError("Select at least one topic."); return; }
    const key = provider === "claude" ? claudeKey : openaiKey;
    if (!key.trim()) { setError("Please enter your API key in Setup."); setShowSetup(true); return; }

    setLoading(true); setError(""); setResults([]); setSearched(false);
    const msgs = ["Scanning GitHub trending repos…","Searching arXiv and blogs…","Indexing Python packages…","Cross-referencing governance docs…","Synthesising intelligence report…"];
    let mi = 0; setStatus(msgs[0]);
    const ticker = setInterval(() => { mi=(mi+1)%msgs.length; setStatus(msgs[mi]); }, 2200);

    try {
      const raw = provider === "claude" ? await searchWithClaude() : await searchWithOpenAI();
      const items = parseResults(raw);
      setResults(items.length > 0 ? items : [{ title:"Raw Report", body: raw.slice(0,400), url:null, tags:["Research"], type:"INSIGHT", topic:"All" }]);
      setSearched(true);
    } catch(e) {
      setError(`Error: ${e.message}`);
    } finally {
      clearInterval(ticker); setLoading(false); setStatus("");
    }
  }, [selected, provider, claudeKey, openaiKey]);

  return (
    <div style={{ minHeight:"100vh", background:"#0a0a0f", paddingBottom:60 }}>

      {/* Header */}
      <div style={{ background:"linear-gradient(180deg,#0f0f1a,#0a0a0f)", borderBottom:"1px solid #1a1a2e", padding:"env(safe-area-inset-top,28px) 20px 20px" }}>
        <div style={{ maxWidth:680, margin:"0 auto" }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
            <div style={{ width:7, height:7, borderRadius:"50%", background:"#f59e0b", boxShadow:"0 0 8px #f59e0b", animation:"pulse-dot 2s infinite" }} />
            <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:"#f59e0b", letterSpacing:"0.15em", textTransform:"uppercase" }}>Intelligence Feed</span>
          </div>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end" }}>
            <div>
              <h1 style={{ fontSize:26, fontWeight:800, letterSpacing:"-0.03em", lineHeight:1.1 }}>
                <span style={{ color:"#fff" }}>AI Research</span><span style={{ color:"#f59e0b" }}> Scout</span>
              </h1>
              <p style={{ color:"#475569", fontSize:12, marginTop:3 }}>GitHub · arXiv · Web — live sweep</p>
            </div>
            <button onClick={()=>setShowSetup(s=>!s)} style={{ background:showSetup?"rgba(99,102,241,0.15)":"#0f0f1a", border:`1px solid ${showSetup?"#6366f1":"#1e1e30"}`, borderRadius:9, padding:"8px 14px", color:showSetup?"#818cf8":"#475569", fontFamily:"'JetBrains Mono',monospace", fontSize:11, cursor:"pointer" }}>
              {showSetup ? "▲ Setup" : "▼ Setup"}
            </button>
          </div>
        </div>
      </div>

      <div style={{ maxWidth:680, margin:"0 auto", padding:"0 16px" }}>

        {/* Setup Panel */}
        {showSetup && (
          <div style={{ marginTop:20, background:"#0f0f1a", border:"1px solid #1e1e30", borderRadius:16, padding:"18px 16px", animation:"fadeUp 0.3s ease" }}>
            <p style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:"#475569", letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:14 }}>API Setup</p>

            {/* Provider tabs */}
            <div style={{ display:"flex", gap:8, marginBottom:16 }}>
              {["claude","openai"].map(p=>(
                <button key={p} onClick={()=>setProvider(p)}
                  style={{ flex:1, padding:"10px 0", borderRadius:10, border:`1px solid ${provider===p?(p==="claude"?"#6366f1":"#10b981"):"#1e1e30"}`, background:provider===p?(p==="claude"?"rgba(99,102,241,0.12)":"rgba(16,185,129,0.12)"):"transparent", color:provider===p?(p==="claude"?"#818cf8":"#34d399"):"#475569", fontFamily:"'Syne',sans-serif", fontWeight:700, fontSize:13, cursor:"pointer" }}>
                  {p==="claude"?"◆ Claude":"◇ OpenAI"}
                </button>
              ))}
            </div>

            {provider === "claude" && (
              <div>
                <label style={{ display:"block", fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:"#64748b", letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:8 }}>Anthropic API Key</label>
                <input type="password" placeholder="sk-ant-..." value={claudeKey} onChange={e=>setClaudeKey(e.target.value)}
                  style={{ width:"100%", background:"#161622", border:"1px solid #2d2d44", borderRadius:8, padding:"12px 14px", color:"#e2e8f0", fontFamily:"'JetBrains Mono',monospace", fontSize:13 }} />
                <p style={{ marginTop:8, fontSize:11, color:"#334155", lineHeight:1.5 }}>Get your key at <strong style={{color:"#6366f1"}}>console.anthropic.com</strong> → API Keys. Uses Claude Sonnet with live web search.</p>
              </div>
            )}
            {provider === "openai" && (
              <div>
                <label style={{ display:"block", fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:"#64748b", letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:8 }}>OpenAI API Key</label>
                <input type="password" placeholder="sk-..." value={openaiKey} onChange={e=>setOpenaiKey(e.target.value)}
                  style={{ width:"100%", background:"#161622", border:"1px solid #2d2d44", borderRadius:8, padding:"12px 14px", color:"#e2e8f0", fontFamily:"'JetBrains Mono',monospace", fontSize:13 }} />
                <p style={{ marginTop:8, fontSize:11, color:"#334155", lineHeight:1.5 }}>Get your key at <strong style={{color:"#10b981"}}>platform.openai.com</strong> → API Keys. Uses GPT-4o with web search.</p>
              </div>
            )}

            <button onClick={()=>setShowSetup(false)} style={{ marginTop:16, width:"100%", padding:"11px 0", background:"rgba(99,102,241,0.15)", border:"1px solid #6366f1", borderRadius:10, color:"#818cf8", fontFamily:"'Syne',sans-serif", fontWeight:700, fontSize:13, cursor:"pointer" }}>
              Done ✓
            </button>
          </div>
        )}

        {/* Topic Selector */}
        <div style={{ marginTop:24, marginBottom:20 }}>
          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:12 }}>
            <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:"#475569", letterSpacing:"0.1em", textTransform:"uppercase" }}>Topics</span>
            <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:"#f59e0b" }}>{selected.length} selected</span>
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
            {TOPICS.map(t => {
              const on = selected.includes(t.id);
              return (
                <button key={t.id} className="topic-chip" onClick={()=>toggleTopic(t.id)}
                  style={{ display:"flex", alignItems:"center", gap:10, padding:"13px 14px", background:on?"rgba(245,158,11,0.1)":"#0f0f1a", border:`1px solid ${on?"#f59e0b":"#1e1e30"}`, borderRadius:12, cursor:"pointer", textAlign:"left" }}>
                  <span style={{ fontSize:15, color:on?"#f59e0b":"#334155" }}>{t.icon}</span>
                  <span style={{ fontFamily:"'Syne',sans-serif", fontWeight:on?700:500, fontSize:12, color:on?"#fcd34d":"#64748b", lineHeight:1.2 }}>{t.label}</span>
                  {on && <span style={{ marginLeft:"auto", width:6, height:6, borderRadius:"50%", background:"#f59e0b", flexShrink:0 }} />}
                </button>
              );
            })}
          </div>
        </div>

        {/* Run Button */}
        <button className="run-btn" onClick={runSearch} disabled={loading||selected.length===0}
          style={{ width:"100%", padding:"17px 24px", background:loading?"#1e1e30":"linear-gradient(135deg,#f59e0b,#d97706)", border:"none", borderRadius:14, cursor:loading?"not-allowed":"pointer", fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:15, color:loading?"#475569":"#0a0a0f", display:"flex", alignItems:"center", justifyContent:"center", gap:10, boxShadow:loading?"none":"0 4px 24px rgba(245,158,11,0.25)" }}>
          {loading ? (
            <>
              <div style={{ width:18, height:18, border:"2px solid #334155", borderTopColor:"#f59e0b", borderRadius:"50%", animation:"spin 0.8s linear infinite" }} />
              <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:12, fontWeight:400, color:"#64748b" }}>{status}</span>
            </>
          ) : "⟳ Run Research Sweep"}
        </button>

        {error && (
          <div style={{ marginTop:14, padding:"12px 16px", background:"rgba(239,68,68,0.08)", border:"1px solid rgba(239,68,68,0.3)", borderRadius:10, color:"#fca5a5", fontSize:13 }}>{error}</div>
        )}

        {/* Results */}
        {searched && results.length > 0 && (
          <div style={{ marginTop:32 }}>
            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:14 }}>
              <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:"#475569", letterSpacing:"0.1em", textTransform:"uppercase" }}>Intelligence Results</span>
              <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:"#10b981" }}>{results.length} findings</span>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
              {results.map((item, i) => {
                const c = CARD_COLORS[i % CARD_COLORS.length];
                return (
                  <div key={i} className="result-card"
                    style={{ animationDelay:`${i*0.06}s`, background:c.bg, border:`1px solid ${c.border}`, borderRadius:14, padding:"16px 18px", cursor:item.url?"pointer":"default" }}
                    onClick={()=>item.url && window.open(item.url,"_blank","noopener")}>
                    <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:8, marginBottom:10 }}>
                      <h3 style={{ margin:0, fontSize:14, fontWeight:700, color:"#f1f5f9", lineHeight:1.3, flex:1 }}>{item.title}</h3>
                      <span style={{ flexShrink:0, fontFamily:"'JetBrains Mono',monospace", fontSize:9, padding:"3px 7px", borderRadius:5, background:"rgba(0,0,0,0.3)", color:TYPE_COLORS[item.type]||"#94a3b8", border:`1px solid ${TYPE_COLORS[item.type]||"#334155"}40`, letterSpacing:"0.08em" }}>{item.type}</span>
                    </div>
                    <p style={{ margin:"0 0 12px", fontSize:13, color:"#94a3b8", lineHeight:1.55 }}>{item.body}</p>
                    <div style={{ display:"flex", flexWrap:"wrap", gap:6, alignItems:"center" }}>
                      {(item.tags||[]).map((tag,j)=>(
                        <span key={j} style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:TAG_COLORS[j%TAG_COLORS.length], background:`${TAG_COLORS[j%TAG_COLORS.length]}15`, padding:"3px 8px", borderRadius:5, border:`1px solid ${TAG_COLORS[j%TAG_COLORS.length]}30` }}>{tag}</span>
                      ))}
                      {item.url && <span style={{ marginLeft:"auto", fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:c.accent, opacity:0.8 }}>↗ open</span>}
                    </div>
                    {item.topic && <div style={{ marginTop:10, paddingTop:10, borderTop:`1px solid ${c.border}50`, fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:"#334155" }}>{item.topic}</div>}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        <div style={{ marginTop:48, textAlign:"center", fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:"#1e293b", lineHeight:2 }}>
          AI Research Scout · Subhagato<br/>
          Keys stay in your browser only
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
